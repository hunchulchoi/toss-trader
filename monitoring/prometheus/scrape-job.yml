global:
  scrape_interval: 30s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: toss-trader
    metrics_path: /metrics
    static_configs:
      - targets:
          - metrics:9108
