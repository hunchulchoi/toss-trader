<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Paper Cycle Timeline</title>
  <link rel="stylesheet" href="/assets/timeline.css">
  <link rel="stylesheet" href="/assets/cycles.css">
  <script src="/assets/cycles.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Paper 장부 타임라인으로 이동">
      <span class="brand-mark">TR</span>
      <span><strong>TOSS / PAPER</strong><small>CYCLE TIMELINE</small></span>
    </a>
    <div class="topbar-meta">
      <span class="status-dot"></span>
      <span id="updated-at">데이터 로딩 중</span>
      <span class="readonly">READ ONLY</span>
    </div>
  </header>

  <main class="cycle-page" data-testid="cycle-timeline">
    <header class="cycle-hero">
      <div>
        <p class="eyebrow">RULE · HERMES / ASIA·SEOUL</p>
        <h1>Cycle Timeline</h1>
        <p class="caption">5분 cycle · 차단 지점</p>
      </div>
      <a class="ledger-link" href="/">장부 타임라인 보기 →</a>
    </header>

    <section class="cycle-controls" aria-label="cycle 필터">
      <label><span>날짜</span><select id="date-filter"></select></label>
      <label><span>포트폴리오</span><select id="portfolio-filter"><option value="all">Rule + Hermes</option><option value="rule">Rule</option><option value="hermes">Hermes</option></select></label>
      <label><span>상태</span><select id="status-filter"><option value="all">전체 상태</option><option value="succeeded">성공</option><option value="running">실행 중</option><option value="failed">실패 포함</option></select></label>
      <button id="refresh" type="button">새로고침</button>
    </section>

    <section class="cycle-kpis" aria-label="cycle 요약">
      <article><span>표시 cycle</span><strong id="run-count">—</strong><small id="pair-count">—</small></article>
      <article><span>성공률</span><strong id="success-rate">—</strong><small id="failure-count">—</small></article>
      <article><span>신호 / 체결</span><strong id="signal-fill">—</strong><small>paper 주문 기준</small></article>
      <article><span>API 오류</span><strong id="api-errors">—</strong><small id="latest-duration">—</small></article>
    </section>

    <section class="cycle-section">
      <div class="cycle-section-head">
        <div><p class="eyebrow">NEWEST FIRST</p><h2>실행 흐름</h2></div>
        <span id="visible-range" class="quiet-pill">—</span>
      </div>
      <div id="cycle-list" class="cycle-list"></div>
      <p id="cycle-empty" class="empty" hidden>조건에 맞는 cycle이 없습니다.</p>
    </section>
  </main>

  <div id="error-state" class="error-state" hidden>
    <strong>Cycle timeline을 불러오지 못했습니다.</strong>
    <button id="retry-load" type="button">다시 시도</button>
  </div>
</body>
</html>
