services:
  trader:
    build: .
    environment:
      TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:-}
      TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:-}
      TOSS_ACCOUNT_SEQ: ${TOSS_ACCOUNT_SEQ:-}
      TOSS_API_BASE_URL: https://openapi.tossinvest.com
      TRADING_ENABLED: "false"
      PAPER_DB_PATH: /app/data/paper.db
      MARKET_DB_PATH: /app/data/market.db
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      MARKET_BENCHMARK_SYMBOLS: ${MARKET_BENCHMARK_SYMBOLS:-069500,229200}
      DISCOVERY_SYMBOLS: ${DISCOVERY_SYMBOLS:-005930,000660,373220,207940,005380,000270,068270,105560,055550,035420,035720,006400,051910,028260,012330}
      DISCOVERY_TOP_N: ${DISCOVERY_TOP_N:-10}
      DYNAMIC_UNIVERSE_REFRESH_MINUTES: ${DYNAMIC_UNIVERSE_REFRESH_MINUTES:-30}
      DYNAMIC_UNIVERSE_CANDIDATE_COUNT: ${DYNAMIC_UNIVERSE_CANDIDATE_COUNT:-30}
      DYNAMIC_UNIVERSE_SIZE: ${DYNAMIC_UNIVERSE_SIZE:-15}
      STRATEGY_INTERVAL: ${STRATEGY_INTERVAL:-1d}
      STRATEGY_SHORT_WINDOW: ${STRATEGY_SHORT_WINDOW:-20}
      STRATEGY_LONG_WINDOW: ${STRATEGY_LONG_WINDOW:-60}
      PAPER_ORDER_QUANTITY: ${PAPER_ORDER_QUANTITY:-1}
      PAPER_INITIAL_CASH: ${PAPER_INITIAL_CASH:-1000000}
      CANDLE_REQUEST_INTERVAL_SECONDS: ${CANDLE_REQUEST_INTERVAL_SECONDS:-0.25}
    volumes:
      - paper-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  metrics:
    build: .
    command: ["serve-metrics"]
    restart: unless-stopped
    environment:
      TRADING_ENABLED: "false"
      PAPER_DB_PATH: /app/data/paper.db
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      PAPER_INITIAL_CASH: ${PAPER_INITIAL_CASH:-1000000}
      CANDLE_REQUEST_INTERVAL_SECONDS: ${CANDLE_REQUEST_INTERVAL_SECONDS:-0.25}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9108
    ports:
      - "${TAILSCALE_IP:-100.74.208.69}:${METRICS_PORT:-9108}:9108"
    volumes:
      - paper-data:/app/data:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' + os.environ['METRICS_PORT'] + '/healthz', timeout=2)
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  automation:
    build: .
    command: ["serve-automation"]
    restart: unless-stopped
    environment:
      TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:-}
      TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:-}
      TOSS_ACCOUNT_SEQ: ${TOSS_ACCOUNT_SEQ:-}
      TOSS_API_BASE_URL: https://openapi.tossinvest.com
      TRADING_ENABLED: "false"
      PAPER_DB_PATH: /app/data/paper.db
      MARKET_DB_PATH: /app/data/market.db
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      MARKET_BENCHMARK_SYMBOLS: ${MARKET_BENCHMARK_SYMBOLS:-069500,229200}
      DISCOVERY_SYMBOLS: ${DISCOVERY_SYMBOLS:-005930,000660,373220,207940,005380,000270,068270,105560,055550,035420,035720,006400,051910,028260,012330}
      DISCOVERY_TOP_N: ${DISCOVERY_TOP_N:-10}
      DYNAMIC_UNIVERSE_REFRESH_MINUTES: ${DYNAMIC_UNIVERSE_REFRESH_MINUTES:-30}
      DYNAMIC_UNIVERSE_CANDIDATE_COUNT: ${DYNAMIC_UNIVERSE_CANDIDATE_COUNT:-30}
      DYNAMIC_UNIVERSE_SIZE: ${DYNAMIC_UNIVERSE_SIZE:-15}
      STRATEGY_INTERVAL: ${STRATEGY_INTERVAL:-1d}
      STRATEGY_SHORT_WINDOW: ${STRATEGY_SHORT_WINDOW:-20}
      STRATEGY_LONG_WINDOW: ${STRATEGY_LONG_WINDOW:-60}
      PAPER_ORDER_QUANTITY: ${PAPER_ORDER_QUANTITY:-1}
      PAPER_INITIAL_CASH: ${PAPER_INITIAL_CASH:-1000000}
      HERMES_API_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      HERMES_API_BASE_URL: http://hermes-analysis:8642
      ALERTMANAGER_API_URL: http://alertmanager:9093/api/v2/alerts
    expose:
      - "8088"
    volumes:
      - paper-data:/app/data
    networks:
      default:
      openclaw:
        aliases:
          - toss-trader-automation
    depends_on:
      alertmanager:
        condition: service_healthy
      hermes-analysis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=2)
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  hermes-analysis:
    build:
      context: ./automation/hermes-analysis
      args:
        HERMES_BASE_IMAGE: ${HERMES_BASE_IMAGE:-hermes-agent-honcho:local}
    image: toss-trader-hermes-analysis:local
    command: ["/opt/hermes-analysis/start.sh"]
    restart: unless-stopped
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?HERMES_API_KEY is required}
      API_SERVER_MODEL_NAME: toss-trader-analysis
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      HERMES_HOME: /opt/data
    expose:
      - "8642"
    volumes:
      - hermes-analysis-data:/opt/data
    networks:
      openclaw:
        aliases:
          - hermes-analysis
    read_only: true
    tmpfs:
      - /tmp
      - /run:exec,mode=755
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /opt/hermes/.venv/bin/python
        - -c
        - >-
          import json, os, urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8642/v1/toolsets',
          headers={'Authorization': 'Bearer ' + os.environ['API_SERVER_KEY']});
          response = json.load(urllib.request.urlopen(request, timeout=3));
          enabled = [item for item in response['data'] if item.get('enabled')];
          resolved = [tool for item in enabled for tool in item.get('tools', [])];
          assert not enabled and not resolved
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    build:
      context: ./monitoring/prometheus
    image: toss-trader-prometheus:local
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "${TAILSCALE_IP:-100.74.208.69}:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      metrics:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  alertmanager:
    build:
      context: ./monitoring/alertmanager
    image: toss-trader-alertmanager:local
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_TOPIC: ${TELEGRAM_TOPIC:-}
    ports:
      - "${TAILSCALE_IP:-100.74.208.69}:${ALERTMANAGER_PORT:-19093}:9093"
    volumes:
      - alertmanager-data:/alertmanager
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:9093/-/healthy
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  paper-data:
  hermes-analysis-data:
  prometheus-data:
  alertmanager-data:

networks:
  openclaw:
    external: true
    name: openclaw-net
